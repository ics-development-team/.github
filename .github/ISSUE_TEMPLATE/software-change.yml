name: Software Change
description: Request and document a production software change
title: "[CHANGE] "
body:
  - type: dropdown
    id: application
    attributes:
      label: Application or System
      description: Select the system affected by this change.
      options:
        - background-jobs
        - api-endpoints
        - job-bank-web
        - Other
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason for Change
      description: Explain why the change is needed.
      placeholder: Describe the problem, request, or business need.
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements and Acceptance Criteria
      description: Describe what must be true for the change to be complete.
      placeholder: |
        - The system should...
        - The user should be able to...
    validations:
      required: true

  - type: dropdown
    id: change-type
    attributes:
      label: Change Type
      options:
        - Normal
        - Emergency
        - Minor standard change
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk Level
      options:
        - Low
        - Moderate
        - High
    validations:
      required: true

  - type: textarea
    id: testing
    attributes:
      label: Testing Plan
      description: Explain how the change will be tested.
      placeholder: |
        - Manual functional testing
        - API testing
        - Regression testing
    validations:
      required: true

  - type: textarea
    id: deployment
    attributes:
      label: Deployment Plan
      description: Describe how the change will be deployed.
      placeholder: |
        Deployment steps:
        Expected downtime:
        Configuration changes:
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: Rollback or Recovery Plan
      description: Explain how service will be restored if deployment fails.
      placeholder: Redeploy the prior version or reverse the configuration change.
    validations:
      required: true

  - type: checkboxes
    id: readiness
    attributes:
      label: Development Readiness
      options:
        - label: No passwords, API keys, tokens, or secrets will be stored in source code.
          required: true
        - label: The change will be tested outside production.
          required: true
        - label: A pull request will be linked to this issue.
          required: true
        - label: The change will receive peer review before normal production deployment.
          required: true
